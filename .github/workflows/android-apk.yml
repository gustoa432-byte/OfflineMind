name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build OfflineMind Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-project/gradlew

      - name: Ensure llama.cpp Sources Are Present
        run: |
          LLAMA_DIR="android-project/app/src/main/cpp/llama.cpp"
          if [ ! -f "$LLAMA_DIR/include/llama.h" ] || [ ! -f "$LLAMA_DIR/src/CMakeLists.txt" ] || [ ! -f "$LLAMA_DIR/ggml/CMakeLists.txt" ]; then
            echo "llama.cpp sources not found or incomplete in git clone. Downloading official release v0.6.0..."
            mkdir -p "$LLAMA_DIR"
            curl -L "https://github.com/ggml-org/llama.cpp/archive/refs/tags/v0.6.0.tar.gz" | tar -xzf - --strip-components=1 -C "$LLAMA_DIR"
          fi
          echo "Verified llama.cpp sources:"
          test -f "$LLAMA_DIR/include/llama.h" && echo "✓ include/llama.h exists"
          test -f "$LLAMA_DIR/src/CMakeLists.txt" && echo "✓ src/CMakeLists.txt exists"
          test -f "$LLAMA_DIR/ggml/CMakeLists.txt" && echo "✓ ggml/CMakeLists.txt exists"

      - name: Build Release APK
        working-directory: android-project
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Inspect and Verify Built APK
        run: |
          APK_FILE=$(find android-project/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::Release APK file not found!"
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "$APK_FILE")
          echo "APK generated: $APK_FILE (size: $FILE_SIZE bytes)"
          if [ "$FILE_SIZE" -le 1000000 ]; then
            echo "::error::APK file size is suspiciously small ($FILE_SIZE bytes)"
            exit 1
          fi

          echo "=== Verifying arm64-v8a native libraries in APK ==="
          unzip -l "$APK_FILE" | grep -E "lib/arm64-v8a/lib.*\.so"
          
          # Ensure libllama-jni.so is present
          unzip -l "$APK_FILE" | grep "lib/arm64-v8a/libllama-jni.so" || {
            echo "::error::libllama-jni.so missing in arm64-v8a ABI folder!"
            exit 1
          }
          echo "Verified: libllama-jni.so is present in arm64-v8a architecture."

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineMind-release-apk
          path: android-project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
