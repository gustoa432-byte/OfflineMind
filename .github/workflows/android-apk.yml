name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build OfflineMind Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK and Accept Licenses
        run: |
          echo "=== Android SDK Configuration ==="
          echo "ANDROID_HOME: $ANDROID_HOME"
          
          # Find sdkmanager binary
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" -type f -perm /111 2>/dev/null | head -n 1)
          fi
          echo "Found sdkmanager at: $SDKMANAGER"

          # Accept all SDK and NDK licenses
          yes | "$SDKMANAGER" --licenses || true

          # Ensure CMake 3.22.1 and required Android 35 platform/build-tools are available
          "$SDKMANAGER" --install "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" || true

          echo "=== Available NDKs in runner ==="
          ls -la "$ANDROID_HOME/ndk" 2>/dev/null || echo "None found in $ANDROID_HOME/ndk"

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-project/gradlew

      - name: Ensure llama.cpp Sources Are Present
        run: |
          LLAMA_DIR="android-project/app/src/main/cpp/llama.cpp"
          if [ ! -f "$LLAMA_DIR/include/llama.h" ] || [ ! -f "$LLAMA_DIR/src/CMakeLists.txt" ] || [ ! -f "$LLAMA_DIR/ggml/CMakeLists.txt" ]; then
            echo "llama.cpp sources not found or incomplete. Downloading release v0.6.0..."
            mkdir -p "$LLAMA_DIR"
            curl -L "https://github.com/ggml-org/llama.cpp/archive/refs/tags/v0.6.0.tar.gz" | tar -xzf - --strip-components=1 -C "$LLAMA_DIR"
          fi
          echo "Verified llama.cpp sources:"
          test -f "$LLAMA_DIR/include/llama.h" && echo "✓ include/llama.h exists"
          test -f "$LLAMA_DIR/src/CMakeLists.txt" && echo "✓ src/CMakeLists.txt exists"
          test -f "$LLAMA_DIR/ggml/CMakeLists.txt" && echo "✓ ggml/CMakeLists.txt exists"

      - name: Build Release APK
        working-directory: android-project
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Inspect and Verify Built APK
        run: |
          echo "=== Searching for all built APKs ==="
          find android-project/app/build -name "*.apk" -ls
          
          APK_FILE=$(find android-project/app/build -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::Release APK file not found!"
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "$APK_FILE")
          echo "APK generated: $APK_FILE (size: $FILE_SIZE bytes)"
          if [ "$FILE_SIZE" -le 1000000 ]; then
            echo "::error::APK file size is suspiciously small ($FILE_SIZE bytes)"
            exit 1
          fi

          echo "=== Verifying native libraries in APK ==="
          unzip -l "$APK_FILE" | grep -E "lib/.*\.so" || true
          
          # Ensure libllama-jni.so is present in APK
          unzip -l "$APK_FILE" | grep "libllama-jni.so" || {
            echo "::error::libllama-jni.so missing in APK!"
            exit 1
          }
          echo "Verified: libllama-jni.so is present in APK."

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineMind-release-apk
          path: android-project/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
